<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Los cuatro elementos de un sistema de información convergiendo en los objetivos de la entidad">
  <defs>
    <marker id="flecha2" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#E40613"/>
    </marker>
  </defs>

  <g font-family="sans-serif" font-weight="700" font-size="16" fill="#1A1A1A">
    <rect x="20" y="20" width="150" height="55" rx="6" fill="#F7F5F4" stroke="#E0DDDC" stroke-width="2"/>
    <text x="95" y="53" text-anchor="middle">Personas</text>

    <rect x="20" y="90" width="150" height="55" rx="6" fill="#F7F5F4" stroke="#E0DDDC" stroke-width="2"/>
    <text x="95" y="123" text-anchor="middle">Datos</text>

    <rect x="20" y="160" width="150" height="55" rx="6" fill="#F7F5F4" stroke="#E0DDDC" stroke-width="2"/>
    <text x="95" y="193" text-anchor="middle">Actividades</text>

    <rect x="20" y="230" width="150" height="55" rx="6" fill="#F7F5F4" stroke="#E0DDDC" stroke-width="2"/>
    <text x="95" y="263" text-anchor="middle">Recursos</text>
  </g>

  <line x1="170" y1="47" x2="235" y2="130" stroke="#E40613" stroke-width="2" marker-end="url(#flecha2)"/>
  <line x1="170" y1="117" x2="235" y2="140" stroke="#E40613" stroke-width="2" marker-end="url(#flecha2)"/>
  <line x1="170" y1="187" x2="235" y2="150" stroke="#E40613" stroke-width="2" marker-end="url(#flecha2)"/>
  <line x1="170" y1="257" x2="235" y2="160" stroke="#E40613" stroke-width="2" marker-end="url(#flecha2)"/>

  <rect x="240" y="110" width="180" height="70" rx="8" fill="#E40613"/>
  <text x="330" y="140" text-anchor="middle" font-family="sans-serif" font-weight="700" font-size="15" fill="#FFFFFF">Sistema de</text>
  <text x="330" y="162" text-anchor="middle" font-family="sans-serif" font-weight="700" font-size="15" fill="#FFFFFF">Información</text>

  <line x1="420" y1="145" x2="480" y2="145" stroke="#E40613" stroke-width="3" marker-end="url(#flecha2)"/>

  <rect x="490" y="105" width="130" height="80" rx="40" fill="#F7F5F4" stroke="#E40613" stroke-width="2"/>
  <text x="555" y="140" text-anchor="middle" font-family="sans-serif" font-weight="700" font-size="14" fill="#1A1A1A">Objetivos</text>
  <text x="555" y="158" text-anchor="middle" font-family="sans-serif" font-weight="700" font-size="14" fill="#1A1A1A">de la entidad</text>
</svg>

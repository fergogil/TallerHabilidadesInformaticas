<svg viewBox="0 0 500 220" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Una variable es un recipiente que guarda un dato y puede cambiar de contenido">
  <g font-family="sans-serif" fill="#1A1A1A">
    <path d="M 130 60 L 130 160 Q 130 185 155 185 L 245 185 Q 270 185 270 160 L 270 60 Z" fill="#F7F5F4" stroke="#E40613" stroke-width="3"/>
    <text x="200" y="130" text-anchor="middle" font-weight="700" font-size="20">X</text>
    <text x="200" y="45" text-anchor="middle" font-weight="700" font-size="16">Variable</text>

    <rect x="330" y="90" width="90" height="50" rx="6" fill="#E40613"/>
    <text x="375" y="121" text-anchor="middle" fill="#fff" font-weight="700" font-size="18">3</text>
    <text x="375" y="75" text-anchor="middle" font-size="13">dato actual</text>

    <path d="M320,115 L275,115" stroke="#E40613" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#flechaV)"/>
    <defs>
      <marker id="flechaV" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
        <path d="M0,0 L9,4.5 L0,9 Z" fill="#E40613"/>
      </marker>
    </defs>

    <text x="200" y="210" text-anchor="middle" font-size="13" fill="#666">Puede cambiar de contenido durante la ejecución</text>
  </g>
</svg>

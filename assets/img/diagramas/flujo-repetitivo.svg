<svg viewBox="0 0 420 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Diagrama de flujo repetitivo: una condición repite una acción mientras se cumpla">
  <defs>
    <marker id="flechaRep" markerWidth="9" markerHeight="9" refX="4.5" refY="7" orient="auto">
      <path d="M0,0 L9,0 L4.5,9 Z" fill="#E40613"/>
    </marker>
  </defs>
  <g font-family="sans-serif" font-weight="700" font-size="15">
    <polygon points="210,10 300,65 210,120 120,65" fill="#E40613"/>
    <text x="210" y="70" text-anchor="middle" fill="#fff" font-size="13">CONDICIÓN</text>

    <line x1="210" y1="120" x2="210" y2="155" stroke="#E40613" stroke-width="3" marker-end="url(#flechaRep)"/>
    <text x="225" y="140" font-size="13" fill="#1A1A1A">Sí</text>

    <rect x="140" y="160" width="140" height="50" rx="6" fill="#F7F5F4" stroke="#E0DDDC" stroke-width="2"/>
    <text x="210" y="190" text-anchor="middle" fill="#1A1A1A">ACCIÓN</text>

    <line x1="140" y1="185" x2="60" y2="185" stroke="#E40613" stroke-width="3"/>
    <line x1="60" y1="185" x2="60" y2="65" stroke="#E40613" stroke-width="3"/>
    <line x1="60" y1="65" x2="120" y2="65" stroke="#E40613" stroke-width="3" marker-end="url(#flechaRep)"/>

    <line x1="300" y1="65" x2="360" y2="65" stroke="#E40613" stroke-width="3" marker-end="url(#flechaRep)"/>
    <text x="330" y="55" text-anchor="middle" font-size="13" fill="#1A1A1A">No</text>
    <text x="330" y="90" text-anchor="middle" font-size="12" fill="#666">Fin del ciclo</text>
  </g>
</svg>

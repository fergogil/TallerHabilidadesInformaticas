<svg viewBox="0 0 640 240" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Hardware y software interactuando en un sistema de cómputo">
  <defs>
    <marker id="flecha4" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#E40613"/>
    </marker>
    <marker id="flecha4-inv" markerWidth="10" markerHeight="10" refX="2" refY="5" orient="auto">
      <path d="M10,0 L0,5 L10,10 Z" fill="#E40613"/>
    </marker>
  </defs>

  <!-- Icono simple de monitor para HARDWARE -->
  <rect x="55" y="45" width="130" height="85" rx="6" fill="#F7F5F4" stroke="#E0DDDC" stroke-width="2"/>
  <rect x="70" y="58" width="100" height="60" rx="3" fill="#1A1A1A"/>
  <rect x="105" y="130" width="30" height="10" fill="#E0DDDC"/>
  <text x="120" y="175" text-anchor="middle" font-family="sans-serif" font-weight="700" font-size="18" fill="#1A1A1A">HARDWARE</text>

  <line x1="200" y1="100" x2="440" y2="100" stroke="#E40613" stroke-width="3" marker-end="url(#flecha4)" marker-start="url(#flecha4-inv)"/>
  <text x="320" y="85" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#666">interactúan</text>

  <!-- Icono simple de "código" para SOFTWARE -->
  <rect x="455" y="45" width="130" height="85" rx="6" fill="#E40613"/>
  <text x="520" y="98" text-anchor="middle" font-family="ui-monospace, monospace" font-weight="700" font-size="26" fill="#FFFFFF">&lt;/&gt;</text>
  <text x="520" y="175" text-anchor="middle" font-family="sans-serif" font-weight="700" font-size="18" fill="#1A1A1A">SOFTWARE</text>
</svg>

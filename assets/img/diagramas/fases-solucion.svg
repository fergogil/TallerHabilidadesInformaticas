<svg viewBox="0 0 700 200" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Análisis, diseño e implementación como fases de solución de un problema">
  <defs>
    <marker id="flechaF" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#E40613"/>
    </marker>
  </defs>
  <g font-family="sans-serif" font-weight="700" font-size="16">
    <rect x="10" y="60" width="190" height="80" rx="8" fill="#F7F5F4" stroke="#E0DDDC" stroke-width="2"/>
    <text x="105" y="95" text-anchor="middle" fill="#1A1A1A">Análisis del</text>
    <text x="105" y="115" text-anchor="middle" fill="#1A1A1A">problema</text>

    <line x1="205" y1="100" x2="255" y2="100" stroke="#E40613" stroke-width="3" marker-end="url(#flechaF)"/>

    <rect x="260" y="50" width="190" height="100" rx="8" fill="#E40613"/>
    <text x="355" y="90" text-anchor="middle" fill="#fff">Diseño del</text>
    <text x="355" y="110" text-anchor="middle" fill="#fff">algoritmo</text>
    <text x="355" y="130" text-anchor="middle" fill="#fff" font-size="12" font-weight="400">(pseudocódigo, flujograma)</text>

    <line x1="455" y1="100" x2="505" y2="100" stroke="#E40613" stroke-width="3" marker-end="url(#flechaF)"/>

    <rect x="510" y="60" width="190" height="80" rx="8" fill="#F7F5F4" stroke="#E0DDDC" stroke-width="2"/>
    <text x="605" y="95" text-anchor="middle" fill="#1A1A1A">Implementación</text>
    <text x="605" y="115" text-anchor="middle" fill="#1A1A1A" font-size="12" font-weight="400">(codificar y probar)</text>
  </g>
</svg>

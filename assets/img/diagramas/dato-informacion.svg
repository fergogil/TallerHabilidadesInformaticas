<svg viewBox="0 0 640 260" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Comparación entre un dato y la información">
  <rect x="20" y="30" width="280" height="200" rx="10" fill="#F7F5F4" stroke="#E0DDDC" stroke-width="2"/>
  <text x="160" y="65" text-anchor="middle" font-family="sans-serif" font-weight="700" font-size="18" fill="#1A1A1A">DATO</text>
  <text x="160" y="140" text-anchor="middle" font-family="sans-serif" font-weight="700" font-size="30" fill="#666">4.500.000</text>
  <text x="160" y="205" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#666">Un número, sin contexto</text>

  <line x1="300" y1="130" x2="340" y2="130" stroke="#E40613" stroke-width="3"/>
  <text x="320" y="115" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#E40613">+</text>
  <text x="320" y="160" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#E40613">contexto</text>

  <rect x="340" y="30" width="280" height="200" rx="10" fill="#E40613"/>
  <text x="480" y="65" text-anchor="middle" font-family="sans-serif" font-weight="700" font-size="18" fill="#FFFFFF">INFORMACIÓN</text>
  <text x="480" y="120" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#FFFFFF">Gasto en nómina: agosto</text>
  <text x="480" y="145" text-anchor="middle" font-family="sans-serif" font-weight="700" font-size="20" fill="#FFFFFF">$4.500.000</text>
  <text x="480" y="175" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#FFE5E7">+12% vs. julio</text>
</svg>

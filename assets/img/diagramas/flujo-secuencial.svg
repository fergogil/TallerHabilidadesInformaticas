    <text x="130" y="208" fill="#1A1A1A">Acción 2</text>
    <line x1="130" y1="225" x2="130" y2="260" stroke="#E40613" stroke-width="3" marker-end="url(#flechaS)"/>

    <rect x="40" y="265" width="180" height="45" rx="6" fill="#F7F5F4" stroke="#E0DDDC" stroke-width="2"/>
    <text x="130" y="293" fill="#1A1A1A">Acción N</text>
    <line x1="130" y1="310" x2="130" y2="345" stroke="#E40613" stroke-width="3" marker-end="url(#flechaS)"/>

    <rect x="40" y="350" width="180" height="45" rx="22" fill="#E40613"/>

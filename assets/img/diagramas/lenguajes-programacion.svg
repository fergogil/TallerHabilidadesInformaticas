<svg viewBox="0 0 640 260" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Una misma lógica de pseudocódigo se traduce a distintos lenguajes de programación">
  <defs>
    <marker id="flecha5" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#E40613"/>
    </marker>
  </defs>

  <rect x="200" y="15" width="240" height="65" rx="8" fill="#E40613"/>
  <text x="320" y="53" text-anchor="middle" font-family="sans-serif" font-weight="700" font-size="17" fill="#FFFFFF">Lógica (pseudocódigo)</text>

  <line x1="280" y1="80" x2="140" y2="140" stroke="#E40613" stroke-width="2" marker-end="url(#flecha5)"/>
  <line x1="320" y1="80" x2="320" y2="140" stroke="#E40613" stroke-width="2" marker-end="url(#flecha5)"/>
  <line x1="360" y1="80" x2="500" y2="140" stroke="#E40613" stroke-width="2" marker-end="url(#flecha5)"/>


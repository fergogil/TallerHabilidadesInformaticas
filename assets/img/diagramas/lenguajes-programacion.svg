  <text x="120" y="184" text-anchor="middle" font-family="ui-monospace, monospace" font-weight="700" font-size="17" fill="#1A1A1A">LPP</text>

  <rect x="245" y="150" width="150" height="55" rx="6" fill="#F7F5F4" stroke="#E0DDDC" stroke-width="2"/>
  <text x="320" y="184" text-anchor="middle" font-family="ui-monospace, monospace" font-weight="700" font-size="16" fill="#1A1A1A">JavaScript</text>

  <rect x="445" y="150" width="150" height="55" rx="6" fill="#F7F5F4" stroke="#E0DDDC" stroke-width="2"/>

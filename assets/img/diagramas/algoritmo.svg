<svg viewBox="0 0 640 200" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Un algoritmo es una secuencia de pasos precisos que llevan a un resultado">
  <defs>
    <marker id="flechaA" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#E40613"/>
    </marker>
  </defs>
  <g font-family="sans-serif" font-weight="700" font-size="16" fill="#1A1A1A">
    <circle cx="60" cy="100" r="45" fill="#F7F5F4" stroke="#E0DDDC" stroke-width="2"/>
    <text x="60" y="106" text-anchor="middle">Paso 1</text>
    <line x1="108" y1="100" x2="160" y2="100" stroke="#E40613" stroke-width="3" marker-end="url(#flechaA)"/>

    <circle cx="210" cy="100" r="45" fill="#F7F5F4" stroke="#E0DDDC" stroke-width="2"/>
    <text x="210" y="106" text-anchor="middle">Paso 2</text>
    <line x1="258" y1="100" x2="310" y2="100" stroke="#E40613" stroke-width="3" marker-end="url(#flechaA)"/>

    <circle cx="360" cy="100" r="45" fill="#F7F5F4" stroke="#E0DDDC" stroke-width="2"/>
    <text x="360" y="106" text-anchor="middle">Paso 3</text>
    <line x1="408" y1="100" x2="460" y2="100" stroke="#E40613" stroke-width="3" marker-end="url(#flechaA)"/>

    <circle cx="550" cy="100" r="55" fill="#E40613"/>
    <text x="550" y="95" text-anchor="middle" fill="#fff">Resultado</text>
    <text x="550" y="115" text-anchor="middle" fill="#fff" font-size="13">(finito)</text>
  </g>
</svg>

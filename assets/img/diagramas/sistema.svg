<svg viewBox="0 0 640 220" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Diagrama de un sistema: entrada, proceso y salida">
  <defs>
    <marker id="flecha1" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#E40613"/>
    </marker>
  </defs>

  <rect x="20" y="70" width="150" height="80" rx="8" fill="#F7F5F4" stroke="#E0DDDC" stroke-width="2"/>
  <text x="95" y="115" text-anchor="middle" font-family="sans-serif" font-weight="700" font-size="20" fill="#1A1A1A">Entrada</text>

  <line x1="175" y1="110" x2="235" y2="110" stroke="#E40613" stroke-width="3" marker-end="url(#flecha1)"/>

  <rect x="245" y="55" width="150" height="110" rx="8" fill="#E40613"/>
  <text x="320" y="115" text-anchor="middle" font-family="sans-serif" font-weight="700" font-size="20" fill="#FFFFFF">Proceso</text>

  <line x1="400" y1="110" x2="460" y2="110" stroke="#E40613" stroke-width="3" marker-end="url(#flecha1)"/>

  <rect x="470" y="70" width="150" height="80" rx="8" fill="#F7F5F4" stroke="#E0DDDC" stroke-width="2"/>
  <text x="545" y="115" text-anchor="middle" font-family="sans-serif" font-weight="700" font-size="20" fill="#1A1A1A">Salida</text>

  <text x="95" y="195" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#666">Datos</text>
  <text x="545" y="195" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#666">Información</text>
</svg>
